<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hybrid Attendance Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1>Hybrid Attendance Planner</h1>
    <div class="controls">
      <button id="prevMonth">◀</button>
      <h2 id="monthLabel"></h2>
      <button id="nextMonth">▶</button>
    </div>
  </header>

  <section class="summary">
    <div><strong>In Office:</strong> <span id="inOfficeCount">0</span></div>
    <div><strong>Possible Days:</strong> <span id="possibleDays">0</span></div>
    <div><strong>Attendance Score:</strong> <span id="attendanceScore">0</span></div>
  </section>

  <section class="calendar" id="calendar"></section>

  <footer>
    <p>Click a day to cycle status: In Office → WFH → PTO → WFA</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
